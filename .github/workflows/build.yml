name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  # Fills in the generated Android/iOS project files that are not committed.
  # Existing files (manifest, Info.plist, icons) are kept.
  FLUTTER_CREATE: flutter create --org com.haam --project-name haam_remote --platforms android,ios .

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # to publish logs to the ci-logs branch
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - run: mkdir -p ci-logs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mock TV dependencies
        run: pip install pyopenssl cryptography androidtvremote2 adb-shell

      - name: Validate the mock TV against the reference client
        run: |
          set -o pipefail
          python tool/mock_tv/validate_mock.py 2>&1 | tee ci-logs/validate_mock.txt
          python tool/mock_tv/validate_mock_adb.py 2>&1 | tee -a ci-logs/validate_mock.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the TV helper app
        run: set -o pipefail; tv_app/build.sh ${{ github.run_number }} 2>&1 | tee ci-logs/tv_app.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform projects
        run: set -o pipefail; ${{ env.FLUTTER_CREATE }} 2>&1 | tee ci-logs/create.txt

      - run: set -o pipefail; flutter pub get 2>&1 | tee ci-logs/pub_get.txt

      - name: Check formatting
        run: |
          if ! dart format --output=show --set-exit-if-changed lib test > ci-logs/format.txt 2>&1; then
            echo "::warning::Some files are not dart-formatted. Run 'dart format lib test'."
          fi

      - name: Analyze
        run: set -o pipefail; flutter analyze 2>&1 | tee ci-logs/analyze.txt

      - name: Test (unit, widget, and end-to-end against the mock TV)
        env:
          REQUIRE_MOCK_TV: '1'
        run: set -o pipefail; flutter test --reporter expanded 2>&1 | tee ci-logs/test.txt

      - name: Render screenshots of the main screens
        run: |
          set -o pipefail
          flutter test --tags screenshots --run-skipped --update-goldens 2>&1 | tee ci-logs/screenshots.txt
          mkdir -p ci-logs/screenshots && cp test/screenshots/goldens/*.png ci-logs/screenshots/

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test/screenshots/goldens/

      - name: Publish logs to the ci-logs branch
        if: always()
        run: |
          cd ci-logs
          git init -q && git checkout -q -b ci-logs
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "Logs for run $GITHUB_RUN_ID" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write  # to publish the build log to the ci-logs-android branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform projects
        run: ${{ env.FLUTTER_CREATE }}

      - name: Build the TV helper app (bundled into the phone app)
        run: tv_app/build.sh ${{ github.run_number }}

      - name: Build release APK
        run: |
          set -o pipefail
          mkdir -p ci-logs
          flutter build apk --release --build-number ${{ github.run_number }} 2>&1 | tee ci-logs/android_build.txt

      - name: Publish build log to the ci-logs-android branch
        if: always()
        run: |
          mkdir -p ci-logs && cd ci-logs
          git init -q && git checkout -q -b ci-logs-android
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "Android build log for run $GITHUB_RUN_ID" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-android

      - name: Sign with the app's own key
        # The same key on every build, so new versions install over old ones.
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" sign \
            --ks android/signing/sideload.p12 --ks-type PKCS12 \
            --ks-pass pass:haamremote --ks-key-alias haam \
            --out haam-remote.apk build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs haam-remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: haam-remote-apk
          path: haam-remote.apk

  ios:
    name: iOS (unsigned IPA)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform projects
        run: ${{ env.FLUTTER_CREATE }}

      - name: Build
        run: flutter build ios --release --no-codesign --build-number ${{ github.run_number }}

      - name: Package unsigned IPA (sign it with Sideloadly or AltStore)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry haam-remote-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: haam-remote-ipa
          path: haam-remote-unsigned.ipa

  release:
    name: Publish "latest" release
    needs: [android, ios]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: haam-remote-apk

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: haam-remote-ipa

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          files="haam-remote.apk"
          [ -f haam-remote-unsigned.ipa ] && files="$files haam-remote-unsigned.ipa"
          gh release create latest $files \
            --target "$GITHUB_SHA" \
            --title "HAAM Remote (build ${{ github.run_number }})" \
            --notes "Android: download haam-remote.apk on your phone and open it to install. iPhone: haam-remote-unsigned.ipa, install with Sideloadly or AltStore."
